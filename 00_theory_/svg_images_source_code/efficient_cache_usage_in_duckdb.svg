<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Эффективное использование кэша в DuckDB
  </text>

  <text x="400" y="80" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">
    Оптимизация доступа к памяти через колоночное хранение
  </text>

  <!-- Columnar Storage Section -->
  <g>
    <rect x="50" y="120" width="280" height="350" rx="15" fill="url(#grad1)" opacity="0.9"/>
    <text x="190" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Колоночное хранение
    </text>

    <!-- Column Vector (Age) -->
    <rect x="120" y="190" width="140" height="240" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="8"/>
    <text x="190" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Age
    </text>

    <!-- Cache Lines Visualization -->
    <rect x="130" y="240" width="120" height="30" fill="#ffffff" fill-opacity="0.4" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="130" y="275" width="120" height="30" fill="#ffffff" fill-opacity="0.4" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="130" y="310" width="120" height="30" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1"/>
    <rect x="130" y="345" width="120" height="30" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1"/>
    <rect x="130" y="380" width="120" height="30" fill="#ffffff" fill-opacity="0.3" stroke="#ffffff" stroke-width="1"/>

  </g>

  <!-- Memory Hierarchy Section -->
  <g>
    <rect x="470" y="120" width="280" height="350" rx="15" fill="url(#grad2)" opacity="0.9"/>
    <text x="610" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Иерархия памяти
    </text>

    <!-- CPU -->
    <rect x="545" y="190" width="130" height="50" rx="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <text x="610" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
      CPU
    </text>

    <!-- L1 Cache -->
    <rect x="520" y="255" width="180" height="40" rx="8" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
    <text x="610" y="280" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">
      L1 Cache (64KB)
    </text>

    <!-- L2 Cache -->
    <rect x="500" y="305" width="220" height="45" rx="8" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
    <text x="610" y="333" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">
      L2 Cache (256KB)
    </text>

    <!-- L3 Cache -->
    <rect x="480" y="360" width="260" height="50" rx="8" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
    <text x="610" y="390" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">
      L3 Cache (8-32MB)
    </text>

    <!-- Main Memory -->
    <rect x="480" y="420" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <text x="610" y="445" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">
      RAM
    </text>
  </g>

  <!-- Data Movement Arrow -->
  <g>
    <path d="M 330 290 Q 400 290, 470 330" stroke="#ffffff" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8"/>
    <text x="360" y="265" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">
      Предсказуемый
    </text>
    <text x="360" y="285" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">
      последовательный
    </text>
    <text x="360" y="305" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">
      доступ
    </text>
  </g>

  <!-- Benefits Section -->
   <g>
    <rect x="50" y="490" width="700" height="130" rx="15" fill="url(#grad4)" opacity="0.9"/>
    <text x="400" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Преимущества кэш-эффективности
    </text>
    <text x="400" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">
      • Последовательный доступ к однородным данным
    </text>
    <text x="400" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">
      • Максимальное использование кэш-линий
    </text>
     <text x="400" y="585" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">
      • Эффективный prefetching
    </text>
    <text x="400" y="605" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">
      • Высокая пропускная способность
    </text>
  </g>
</svg>
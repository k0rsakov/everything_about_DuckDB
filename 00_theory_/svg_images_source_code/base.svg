<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7b731;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5cd79;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5f27cd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#341f97;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#0f0f1e"/>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Принципы BASE
  </text>

  <!-- Subtitle -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">
    Подход для распределенных систем и NoSQL баз данных
  </text>

  <!-- BA - Basically Available -->
  <g>
    <rect x="50" y="120" width="700" height="150" rx="15" fill="url(#grad1)" opacity="0.9"/>
    <text x="400" y="155" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      BA - Basically Available
    </text>
    <text x="400" y="185" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">
      Базовая доступность
    </text>
    <text x="400" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Система гарантирует доступность данных, но не гарантирует немедленную согласованность.
    </text>
    <text x="400" y="240" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Некоторые части системы могут быть временно недоступны, но система продолжает работать.
    </text>

    <!-- Icons - Multiple nodes -->
    <circle cx="340" cy="255" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="365" cy="255" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="390" cy="255" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="415" cy="255" r="8" fill="#ffffff" opacity="0.3"/>
    <circle cx="440" cy="255" r="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- S - Soft State -->
  <g>
    <rect x="50" y="300" width="700" height="150" rx="15" fill="url(#grad2)" opacity="0.9"/>
    <text x="400" y="335" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      S - Soft State
    </text>
    <text x="400" y="365" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">
      Мягкое состояние
    </text>
    <text x="400" y="400" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Состояние системы может меняться со временем даже без входящих запросов.
    </text>
    <text x="400" y="420" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Данные могут быть временно несогласованными между разными узлами системы.
    </text>

    <!-- Icon - Wave/Flow -->
    <path d="M 330 435 Q 350 425 370 435 T 410 435 T 450 435"
          stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <circle cx="330" cy="435" r="4" fill="#ffffff" opacity="0.8">
      <animate attributeName="cx" values="330;450;330" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- E - Eventually Consistent -->
  <g>
    <rect x="50" y="480" width="700" height="150" rx="15" fill="url(#grad3)" opacity="0.9"/>
    <text x="400" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      E - Eventually Consistent
    </text>
    <text x="400" y="545" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">
      Итоговая согласованность
    </text>
    <text x="400" y="580" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Система со временем достигнет согласованного состояния, если прекратить запись.
    </text>
    <text x="400" y="600" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
      Все реплики данных в конечном итоге станут одинаковыми.
    </text>

    <!-- Icon - Timeline with convergence -->
    <line x1="320" y1="615" x2="480" y2="615" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <circle cx="330" cy="610" r="5" fill="#ffffff" opacity="0.4"/>
    <circle cx="370" cy="620" r="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="410" cy="612" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="450" cy="615" r="5" fill="#ffffff" opacity="0.9"/>
    <path d="M 330 610 Q 390 605 450 615" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
  </g>
</svg>
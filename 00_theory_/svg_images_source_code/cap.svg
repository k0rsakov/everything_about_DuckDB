<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">
    CAP-теорема
  </text>

  <!-- Subtitle -->
  <text x="450" y="80" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">
    Можно выбрать только два из трёх свойств
  </text>

  <!-- Triangle -->
  <path d="M 450 150 L 250 450 L 650 450 Z"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.2" filter="url(#glow)"/>

  <!-- Consistency (Top) -->
  <g>
    <circle cx="450" cy="150" r="70" fill="url(#gradC)" opacity="0.9"/>
    <text x="450" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      C
    </text>
    <text x="450" y="165" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
      Consistency
    </text>
    <text x="450" y="100" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      Согласованность
    </text>
    <text x="450" y="118" font-family="Arial, sans-serif" font-size="11" fill="#b0b0b0" text-anchor="middle">
      Все узлы видят одинаковые данные
    </text>
  </g>

  <!-- Availability (Bottom Left) -->
  <g>
    <circle cx="250" cy="450" r="70" fill="url(#gradA)" opacity="0.9"/>
    <text x="250" y="445" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      A
    </text>
    <text x="250" y="465" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
      Availability
    </text>
    <text x="140" y="460" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      Доступность
    </text>
    <text x="140" y="478" font-family="Arial, sans-serif" font-size="11" fill="#b0b0b0" text-anchor="middle">
      Система всегда
    </text>
    <text x="140" y="492" font-family="Arial, sans-serif" font-size="11" fill="#b0b0b0" text-anchor="middle">
      отвечает на запросы
    </text>
  </g>

  <!-- Partition Tolerance (Bottom Right) -->
  <g>
    <circle cx="650" cy="450" r="70" fill="url(#gradP)" opacity="0.9"/>
    <text x="650" y="445" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      P
    </text>
    <text x="650" y="465" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
      Partition
    </text>
    <text x="760" y="460" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      Устойчивость к разделению
    </text>
    <text x="760" y="478" font-family="Arial, sans-serif" font-size="11" fill="#b0b0b0" text-anchor="middle">
      Работа при разрыве
    </text>
    <text x="760" y="492" font-family="Arial, sans-serif" font-size="11" fill="#b0b0b0" text-anchor="middle">
      связи между узлами
    </text>
  </g>

  <!-- CA System (Left edge between C and A) -->
  <g>
    <rect x="280" y="265" width="100" height="75" rx="10" fill="#c084fc" opacity="0.4"/>
    <text x="330" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CA
    </text>
    <text x="330" y="308" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">
      (без P)
    </text>
    <text x="330" y="325" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      PostgreSQL,
    </text>
    <text x="330" y="338" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      MySQL
    </text>
  </g>

  <!-- CP System (Right edge between C and P) -->
  <g>
    <rect x="520" y="265" width="100" height="75" rx="10" fill="#38bdf8" opacity="0.4"/>
    <text x="570" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CP
    </text>
    <text x="570" y="308" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">
      (без A)
    </text>
    <text x="570" y="325" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      MongoDB,
    </text>
    <text x="570" y="338" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      HBase, Redis
    </text>
  </g>

  <!-- AP System (Bottom edge between A and P) -->
  <g>
    <rect x="400" y="455" width="100" height="75" rx="10" fill="#fb923c" opacity="0.4"/>
    <text x="450" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      AP
    </text>
    <text x="450" y="498" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">
      (без C)
    </text>
    <text x="450" y="515" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      Cassandra,
    </text>
    <text x="450" y="528" font-family="Arial, sans-serif" font-size="10" fill="#b0b0b0" text-anchor="middle">
      DynamoDB
    </text>
  </g>

  <!-- Examples box -->
  <g>
    <rect x="50" y="580" width="800" height="100" rx="10" fill="#1a1a2e" opacity="0.8" stroke="#ffffff" stroke-width="1"/>
    <text x="450" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Примеры систем:
    </text>

    <text x="70" y="635" font-family="Arial, sans-serif" font-size="12" fill="#c084fc" font-weight="bold">
      CA:
    </text>
    <text x="110" y="635" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
      Реляционные БД (одиночный узел) - нет устойчивости к разделению
    </text>

    <text x="70" y="655" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">
      CP:
    </text>
    <text x="110" y="655" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
      MongoDB, HBase, Redis, Zookeeper - жертвуют доступностью
    </text>

    <text x="70" y="672" font-family="Arial, sans-serif" font-size="12" fill="#fb923c" font-weight="bold">
      AP:
    </text>
    <text x="110" y="672" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0">
      Cassandra, DynamoDB, CouchDB - жертвуют согласованностью
    </text>
  </g>

  <!-- Center note -->
  <text x="450" y="310" font-family="Arial, sans-serif" font-size="13" fill="#ff6b6b" text-anchor="middle" opacity="0.8">
    ⚠ CAP - невозможно!
  </text>
</svg>
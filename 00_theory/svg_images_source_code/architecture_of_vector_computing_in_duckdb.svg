<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="800" height="500" fill="#1a1a2e"/>

  <!-- Заголовок -->
  <text x="400" y="60" font-family="Arial, sans-serif"  font-weight="bold" fill="#ffffff" text-anchor="middle">
    Архитектура векторных вычислений в DuckDB
  </text>

  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">
    Колоночное хранение → Векторная обработка → Параллельное выполнение
  </text>

  <!-- Колоночное хранение -->
  <g>
    <rect x="50" y="150" width="200" height="300" rx="15" fill="url(#grad1)" opacity="0.9"/>
    <text x="150" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Колоночное хранение
    </text>

    <!-- Колонки -->
    <rect x="60" y="220" width="50" height="200" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>
    <rect x="127" y="220" width="50" height="200" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>
    <rect x="195" y="220" width="50" height="200" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>

    <!-- Вертикальный текст для колонок -->
    <text x="75" y="320" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" transform="rotate(-90 90 320)">
      Колонка 1
    </text>
    <text x="137" y="320" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" transform="rotate(-90 150 320)">
      Колонка 2
    </text>
    <text x="200" y="320" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" transform="rotate(-90 215 320)">
      Колонка 3
    </text>
  </g>

  <!-- Векторные операции -->
  <g>
    <rect x="300" y="150" width="200" height="300" rx="15" fill="url(#grad2)" opacity="0.9"/>
    <text x="400" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Векторные операции
    </text>

    <!-- Векторы -->
    <rect x="320" y="230" width="160" height="50" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>
    <rect x="320" y="295" width="160" height="50" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>
    <rect x="320" y="360" width="160" height="50" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" rx="5"/>

    <text x="400" y="250" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
      Вектор 1
    </text>
    <text x="400" y="268" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      (2048 значений)
    </text>

    <text x="400" y="315" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
      Вектор 2
    </text>
    <text x="400" y="333" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      (2048 значений)
    </text>

    <text x="400" y="380" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
      Вектор 3
    </text>
    <text x="400" y="398" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">
      (2048 значений)
    </text>
  </g>

  <!-- Параллельное выполнение -->
  <g>
    <rect x="550" y="150" width="200" height="300" rx="15" fill="url(#grad3)" opacity="0.9"/>
    <text x="650" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Параллельная
    </text>
    <text x="650" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      обработка
    </text>

    <!-- Ядра -->
    <circle cx="600" cy="280" r="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="650" cy="280" r="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="700" cy="280" r="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>

    <text x="600" y="287" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CPU 1
    </text>
    <text x="650" y="287" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CPU 2
    </text>
    <text x="700" y="287" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CPU 3
    </text>

    <!-- Дополнительные ядра для визуального эффекта -->
    <circle cx="625" cy="350" r="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="675" cy="350" r="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>

    <text x="625" y="357" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CPU 4
    </text>
    <text x="675" y="357" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CPU 5
    </text>

    <text x="650" y="410" font-family="Arial, sans-serif" font-size="15" fill="#e0e0e0" text-anchor="middle">
      Morsel-driven
    </text>
    <text x="650" y="430" font-family="Arial, sans-serif" font-size="15" fill="#e0e0e0" text-anchor="middle">
      parallelism
    </text>
  </g>

  <!-- Стрелки -->
  <line x1="250" y1="300" x2="300" y2="300" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.8"/>
  <line x1="500" y1="300" x2="550" y2="300" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.8"/>
</svg>